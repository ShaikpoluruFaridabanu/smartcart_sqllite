{% extends 'base.html' %}

{% block title %}User Login | SmartCart{% endblock %}

{% block content %}

<div class="auth-wrap">
    <section class="auth-card">

        <a class="brand" href="/">
            <span class="brand-mark">S</span>
            <span>Smart<span class="brand-accent">Cart</span></span>
        </a>

        <p class="eyebrow">Welcome back</p>

        <h2>User Login</h2>

        <p class="muted">
            Login to explore products and enjoy shopping.
        </p>

        <form method="POST" action="{{ url_for('user_login') }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="forgot-password-link">
                <a href="{{ url_for('user_forgot_password') }}">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="btn-primary btn-full">
                Login
            </button>

        </form>

        <div class="auth-links">
            <span>New to SmartCart?</span>
            <a href="{{ url_for('user_register') }}">Create Account</a>
        </div>

        <div class="auth-links">
            <a href="/">Back to Home</a>
        </div>

    </section>
</div>

{% endblock %}
