{% extends 'base.html' %}

{% block title %}Verify OTP | SmartCart{% endblock %}

{% block content %}

<div class="auth-wrap">
    <section class="auth-card">

        <div class="feature-icon">✉</div>

        <p class="eyebrow">Email verification</p>

        <h2>Verify Your Email</h2>

        <p class="muted">
            We have sent a 6-digit OTP to your registered email.
            Enter the OTP below to complete your registration.
        </p>

        <form method="POST" action="/user-verify-otp">

            <div class="form-group">
                <label>Enter OTP</label>

                <input
                    type="text"
                    name="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    required
                >
            </div>

            <button type="submit" style="width:100%">
                Verify OTP
            </button>

        </form>

        <div class="auth-links">
            <a href="/user-register">Register Again</a>
            <a href="/user-login">Login</a>
        </div>

    </section>
</div>

{% endblock %}
