{% extends 'base.html' %}
{% block title %}Add Product | SmartCart{% endblock %}
{% block content %}
<div class="form-card">
  <div class="form-intro"><p class="eyebrow">Catalogue management</p><h1>Add a Product</h1><p>Enter the details below to add a new product to your catalogue.</p></div>
  <form method="POST" action="/admin/add-item" enctype="multipart/form-data">
    <div class="form-group"><label>Product Name</label><input type="text" name="name" placeholder="e.g. Classic cotton shirt" required></div>
    <div class="form-group"><label>Description</label><textarea name="description" placeholder="Describe your product..." required></textarea></div>
    <div class="form-group"><label>Category</label><input type="text" name="category" placeholder="e.g. Clothing" required></div>
    <div class="form-group"><label>Price (₹)</label><input type="number" step="0.01" min="0" name="price" placeholder="0.00" required></div>
    <div class="form-group"><label>Product Image</label><input type="file" name="image" accept="image/*" required></div>
    <div class="hero-actions"><button type="submit">Save Product</button><a class="button secondary" href="/admin/item-list">Cancel</a></div>
  </form>
</div>
{% endblock %}
