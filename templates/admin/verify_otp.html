{% extends 'base.html' %}
{% block title %}Verify Registration | SmartCart{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <p class="eyebrow">Email verification</p><h2>Verify Your Email</h2><p class="muted">Enter the OTP sent to your email and create your account password.</p>
  <form method="POST" action="/verify-otp">
    <div class="form-group"><label>6-digit OTP</label><input type="text" name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required></div>
    <div class="form-group"><label>Create Password</label><input type="password" name="password" placeholder="Create a strong password" required></div>
    <button type="submit" style="width:100%">Verify & Register</button>
  </form>
</section></div>
{% endblock %}
