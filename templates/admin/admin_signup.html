{% extends 'base.html' %}
{% block title %}Admin Signup | SmartCart{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <a class="brand" href="/"><span class="brand-mark">S</span><span>Smart<span class="brand-accent">Cart</span></span></a>
  <p class="eyebrow">Join SmartCart</p><h2>Create Admin Account</h2><p class="muted">Enter your details. We will send an OTP to verify your email.</p>
  <form method="POST" action="/admin-signup">
    <div class="form-group"><label>Full Name</label><input type="text" name="name" placeholder="Your name" required></div>
    <div class="form-group"><label>Email Address</label><input type="email" name="email" placeholder="you@example.com" required></div>
    <button type="submit" style="width:100%">Send Verification OTP</button>
  </form>
  <div class="auth-links"><span>Already registered?</span><a href="/admin-login">Sign in</a></div>
</section></div>
{% endblock %}
