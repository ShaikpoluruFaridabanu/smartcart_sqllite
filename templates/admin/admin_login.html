{% extends 'base.html' %}
{% block title %}Admin Login | SmartCart{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <a class="brand" href="/"><span class="brand-mark">S</span><span>Smart<span class="brand-accent">Cart</span></span></a>
  <p class="eyebrow">Welcome back</p><h2>Admin Sign In</h2><p class="muted">Sign in to manage your product catalogue.</p>
  <form method="POST" action="/admin-login">
    <div class="form-group"><label>Email Address</label><input type="email" name="email" placeholder="you@example.com" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Enter your password" required></div>
    <button type="submit" style="width:100%">Sign In</button>
  </form>
  <div class="auth-links"><a href="/admin/forgot">Forgot password?</a><a href="/admin-signup">Create account</a></div>
</section></div>
{% endblock %}
