{% extends 'base.html' %}
{% block title %}Forgot Password | SmartCart{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <p class="eyebrow">Account recovery</p><h2>Forgot Password?</h2><p class="muted">Enter your registered admin email to receive a password reset OTP.</p>
  <form method="POST">
    <div class="form-group"><label>Registered Email</label><input type="email" name="email" placeholder="you@example.com" required></div>
    <button type="submit" style="width:100%">Send OTP</button>
  </form>
  <div class="auth-links"><a href="/admin-login">← Back to Login</a></div>
</section></div>
{% endblock %}
