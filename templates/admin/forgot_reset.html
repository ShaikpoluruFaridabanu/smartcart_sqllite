{% extends 'base.html' %}
{% block title %}Reset Password | SmartCart{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <p class="eyebrow">Almost there</p><h2>Set New Password</h2><p class="muted">Choose a new password with at least 8 characters.</p>
  <form method="POST">
    <div class="form-group"><label>New Password</label><input type="password" name="password" minlength="8" placeholder="New password" required></div>
    <div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="8" placeholder="Confirm password" required></div>
    <button type="submit" style="width:100%">Update Password</button>
  </form>
  <div class="auth-links"><a href="/admin-login">← Back to Login</a></div>
</section></div>
{% endblock %}
